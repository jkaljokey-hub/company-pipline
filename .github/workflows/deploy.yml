name: Deploy Company App

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release tag to deploy, e.g. v1.0.0"
        required: true
        type: string

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test


  deploy-production:
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Checkout selected release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy Production
        run: |
          set -e

          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << EOF

            set -e

            cd /var/www/company-cicd-app/company-pipline

            git fetch --tags origin

            git checkout ${{ inputs.release }}

            git reset --hard ${{ inputs.release }}

            npm ci

            echo "APP_VERSION=${{ inputs.release }}" | sudo tee /etc/company-app.env
            echo "APP_COMMIT=\$(git rev-parse HEAD)" | sudo tee -a /etc/company-app.env

            sudo systemctl restart company-app

            sleep 5

            echo "Checking Node.js..."
            curl -f http://127.0.0.1:3000/health

            echo "Checking Nginx..."
            curl -f http://127.0.0.1/health

            echo "Production version:"
            curl -f http://127.0.0.1/version

          EOF


  deploy-dr:
    needs: deploy-production
    runs-on: ubuntu-latest

    steps:

      - name: Checkout selected release
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "${{ secrets.DR_EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy DR
        run: |
          set -e

          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DR_EC2_USER }}@${{ secrets.DR_EC2_HOST }} << EOF

            set -e

            cd /var/www/company-cicd-app/company-pipline

            git fetch --tags origin

            git checkout ${{ inputs.release }}

            git reset --hard ${{ inputs.release }}

            npm ci

            echo "APP_VERSION=${{ inputs.release }}" | sudo tee /etc/company-app.env
            echo "APP_COMMIT=\$(git rev-parse HEAD)" | sudo tee -a /etc/company-app.env

            sudo systemctl restart company-app

            sleep 5

            echo "Checking Node.js..."
            curl -f http://127.0.0.1:3000/health

            echo "Checking Nginx..."
            curl -f http://127.0.0.1/health

            echo "DR version:"
            curl -f http://127.0.0.1/version

          EOF