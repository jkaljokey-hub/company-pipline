name: Deploy Company App

on:
  workflow_dispatch:

permissions:

    contents: read

jobs:

  # ==========================================
  # 1. TEST
  # ==========================================
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test


  # ==========================================
  # 2. PRODUCTION DEPLOYMENT
  # ==========================================
  deploy-production:
    needs: test
    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Checkout exact tested commit
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy Production
        run: |
          set -e

          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'

            set -e

            cd /var/www/company-cicd-app/company-pipline

            git fetch origin

            git checkout main

            git reset --hard ${{ github.sha }}

            npm ci

            sudo systemctl restart company-app

            sleep 5

            echo "Checking Node.js..."
            curl -f http://127.0.0.1:3000/health

            echo "Checking Nginx..."
            curl -f http://127.0.0.1/health

          EOF

      - name: Production health check
        run: |
          echo "Production deployment successful"
          echo "Production health check passed"


  # ==========================================
  # 3. DR DEPLOYMENT
  # ==========================================
  deploy-dr:
    needs: deploy-production
    runs-on: ubuntu-latest

    environment:
      name: Disaster-Recovery

    steps:

      - name: Checkout exact tested commit
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key

          chmod 600 ~/.ssh/deploy_key

          ssh-keyscan -H "${{ secrets.DR_EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy DR
        run: |
          set -e

          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DR_EC2_USER }}@${{ secrets.DR_EC2_HOST }} << 'EOF'

            set -e

            cd /var/www/company-cicd-app/company-pipline

            git fetch origin

            git checkout main

            git reset --hard ${{ github.sha }}

            npm ci

            sudo systemctl restart company-app

            sleep 5

            curl -f http://localhost:3000/health

          EOF

      - name: DR health check
        run: |
          echo "DR deployment successful"
          echo "DR health check passed"

    
  # ==========================================
  # 4. CREATE AUTOMATIC RELEASE TAG
  # ==========================================
  create-release-tag:
    needs: deploy-dr
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository and fetch tags
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          fetch-tags: true

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate next version tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          git fetch --tags origin

          latest_tag=$(git tag --list \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -n 1 || true)

          if [ -z "$latest_tag" ]; then
            new_tag="v1.0.0"
          else
            IFS='.' read -r major minor patch \
              <<< "${latest_tag#v}"

            new_tag="v${major}.${minor}.$((patch + 1))"
          fi

          echo "Latest release: ${latest_tag:-none}"
          echo "New release: $new_tag"

          echo "tag=$new_tag" >> "$GITHUB_OUTPUT"

      - name: Create and push release tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          git tag -a "$RELEASE_TAG" \
            "$GITHUB_SHA" \
            -m "Release $RELEASE_TAG"

          git push origin "$RELEASE_TAG"

          echo "Release $RELEASE_TAG created successfully."
          echo "Deployed commit: $GITHUB_SHA"
